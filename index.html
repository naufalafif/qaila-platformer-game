<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Platformer</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%; background: #5c94fc; overflow: hidden;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; background: #5c94fc; image-rendering: pixelated; touch-action: none; }
  #hud {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
    font: bold clamp(14px, 3vw, 18px) monospace; color: #fff; text-shadow: 2px 2px #000;
  }
  #fsBtn {
    position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
    font: bold clamp(12px, 2.6vw, 14px) monospace; padding: 6px 10px; cursor: pointer;
    background: rgba(0,0,0,0.4); color: #fff; border: 2px solid #fff; border-radius: 4px;
  }
  #zoomControls {
    position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 40px);
    right: max(16px, env(safe-area-inset-right));
    display: flex; gap: 6px;
  }
  .zoomBtn {
    font: bold 18px monospace; width: 32px; height: 32px; padding: 0; cursor: pointer;
    background: rgba(0,0,0,0.4); color: #fff; border: 2px solid #fff; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; user-select: none;
  }
  #helpBtn {
    position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 78px);
    right: max(16px, env(safe-area-inset-right));
    font: bold 18px monospace; width: 32px; height: 32px; padding: 0; cursor: pointer;
    background: rgba(0,0,0,0.4); color: #fff; border: 2px solid #fff; border-radius: 4px;
  }
  #legend {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); z-index: 20; padding: 16px; box-sizing: border-box;
  }
  #legend.hidden { display: none; }
  #legend .panel {
    background: rgba(20,30,50,0.95); border: 3px solid #fff; border-radius: 10px;
    padding: 20px 24px; max-width: 380px; color: #fff; font: 14px monospace;
    text-align: left;
  }
  #legend h2 { margin: 0 0 12px; font: bold clamp(18px, 5vw, 22px) monospace; text-align: center; }
  #legend .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  #legend .key {
    display: inline-block; min-width: 28px; text-align: center; padding: 3px 8px;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.5); border-radius: 4px;
    font-weight: bold;
  }
  #legend button {
    display: block; margin: 16px auto 0; font: bold 16px monospace; padding: 8px 20px; cursor: pointer;
  }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; font: bold clamp(20px, 6vw, 32px) monospace; color: #fff; text-shadow: 2px 2px #000;
    background: rgba(0,0,0,0.4);
  }
  #overlay button {
    margin-top: 16px; font: bold clamp(16px, 4vw, 18px) monospace; padding: 10px 20px; cursor: pointer;
  }
  #touchControls { display: none; }
  @media (hover: none) and (pointer: coarse) {
    #touchControls { display: block; }
  }
  .ctrlBtn {
    position: fixed; bottom: max(24px, env(safe-area-inset-bottom));
    width: 68px; height: 68px; border-radius: 50%;
    background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.6);
    color: #fff; font: bold 28px monospace; text-shadow: 1px 1px #000;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #btnLeft { left: max(24px, env(safe-area-inset-left)); }
  #btnRight { left: max(104px, calc(env(safe-area-inset-left) + 104px)); }
  #btnJump { right: max(24px, env(safe-area-inset-right)); width: 84px; height: 84px; font-size: 16px; }
  #btnAttack { right: calc(max(24px, env(safe-area-inset-right)) + 96px); font-size: 24px; }
  .ctrlBtn.active { background: rgba(255,255,255,0.5); }
  #rotateHint {
    position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 40px); left: 50%; transform: translateX(-50%);
    display: none; text-align: center; padding: 5px 12px; border-radius: 6px; max-width: 80vw;
    font: bold clamp(10px, 3vw, 12px) monospace; color: #fff; background: rgba(0,0,0,0.55);
    pointer-events: none;
  }
  @media (max-aspect-ratio: 1/1) and (max-width: 820px) {
    #rotateHint { display: block; }
  }
</style>
</head>
<body>
<div id="hud">Lives: <span id="lives">3</span></div>
<button id="fsBtn">⛶ Fullscreen</button>
<div id="zoomControls">
  <button id="zoomOutBtn" class="zoomBtn">−</button>
  <button id="zoomInBtn" class="zoomBtn">+</button>
</div>
<button id="helpBtn">?</button>
<canvas id="game"></canvas>
<div id="touchControls">
  <div id="btnLeft" class="ctrlBtn">◀</div>
  <div id="btnRight" class="ctrlBtn">▶</div>
  <div id="btnAttack" class="ctrlBtn">⚔</div>
  <div id="btnJump" class="ctrlBtn">JUMP</div>
</div>
<div id="rotateHint">Tip: landscape gives a wider view</div>
<div id="legend">
  <div class="panel">
    <h2>How to Play</h2>
    <div class="row"><span class="key">◀ ▶</span> or <span class="key">A</span> <span class="key">D</span> — Move</div>
    <div class="row"><span class="key">Space</span> or <span class="key">▲</span> — Jump (press again in air to double-jump)</div>
    <div class="row"><span class="key">X</span> — Attack</div>
    <div class="row">On mobile: use the ◀ ▶ ⚔ JUMP buttons on screen</div>
    <div class="row">Stomp or attack enemies, avoid getting hit, reach the flag!</div>
    <button id="legendCloseBtn">Let's go!</button>
  </div>
</div>
<div id="overlay">
  <div id="overlayText"></div>
  <button id="restartBtn">Restart</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// VIEW_WIDTH is the number of world-units shown across the screen width, so sprites are
// a consistent, readable size regardless of device/window size. (Smaller = more zoomed in.)
const ZOOM_MIN = 280, ZOOM_MAX = 680, ZOOM_STEP = 60, ZOOM_DEFAULT = 480;
let VIEW_WIDTH = Number(localStorage.getItem('platformer_viewWidth')) || ZOOM_DEFAULT;
let scale = 1;

function updateScale() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  scale = canvas.width / VIEW_WIDTH;
  ctx.imageSmoothingEnabled = false;
}
updateScale();

function logicalHeight() { return canvas.height / scale; }

const GRAVITY = 0.28; // slow, floaty jump arc - easy to time stomps and jumps against enemies
// GROUND_Y is a fixed proportion of the logical (world-unit) screen height, so the
// ground always takes up the same small slice of the screen on any aspect ratio
// (portrait phones included) instead of a fixed pixel value that could dominate a tall screen.
const GROUND_RATIO = 0.72;
let GROUND_Y = Math.round(logicalHeight() * GROUND_RATIO);
const GROUND_DEPTH = 600; // deep enough to fill below the ground on any screen height

// Bump this whenever an image/sound asset file changes - it's appended as a query string so
// browsers (mobile Safari especially) can't serve a stale cached copy of the updated file.
const ASSET_VERSION = 2;

// ---- Sounds (Kenney "Interface Sounds" & "Music Jingles" packs, CC0 - assets/sounds/) ----
function loadSound(src) {
  const audio = new Audio(src + '?v=' + ASSET_VERSION);
  audio.volume = 0.5;
  return audio;
}
const sounds = {
  jump: loadSound('assets/sounds/jump.mp3'),
  stomp: loadSound('assets/sounds/stomp.mp3'),
  attack: loadSound('assets/sounds/attack.mp3'),
  hurt: loadSound('assets/sounds/hurt.mp3'),
  win: loadSound('assets/sounds/win.mp3'),
  gameover: loadSound('assets/sounds/gameover.mp3'),
};
function playSound(name) {
  const s = sounds[name];
  s.currentTime = 0;
  s.play().catch(() => {}); // ignore if not yet allowed by the browser's autoplay policy
}

const fsBtn = document.getElementById('fsBtn');
fsBtn.addEventListener('click', () => {
  const req = !document.fullscreenElement
    ? document.documentElement.requestFullscreen()
    : document.exitFullscreen();
  req.catch(() => {}); // fullscreen isn't available on some mobile browsers (e.g. iOS Safari) - ignore
});

// on-screen touch controls (shown on touch devices via the #touchControls media query)
function bindHoldButton(el, keyCode) {
  const press = e => { e.preventDefault(); keys[keyCode] = true; el.classList.add('active'); };
  const release = e => { e.preventDefault(); keys[keyCode] = false; el.classList.remove('active'); };
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}
bindHoldButton(document.getElementById('btnLeft'), 'ArrowLeft');
bindHoldButton(document.getElementById('btnRight'), 'ArrowRight');
bindHoldButton(document.getElementById('btnJump'), 'Space');
bindHoldButton(document.getElementById('btnAttack'), 'KeyX');
// jump/attack also need one-shot "just pressed" edges, same as a keyboard press
document.getElementById('btnJump').addEventListener('pointerdown', () => keysPressed.add('Space'));
document.getElementById('btnAttack').addEventListener('pointerdown', () => keysPressed.add('KeyX'));

// ---- Sprites (Kenney "Pixel Platformer" pack, CC0 - assets/KENNEY_LICENSE.txt) ----
function loadImage(src) {
  const img = new Image();
  img.src = src + '?v=' + ASSET_VERSION;
  return img;
}
const sprites = {
  ground: loadImage('assets/ground.png'),
  questionBlock: loadImage('assets/question_block.png'),
  tree: loadImage('assets/tree.png'),
  bush: loadImage('assets/bush.png'),
  flagPole: loadImage('assets/flag_pole.png'),
  flagBanner: loadImage('assets/flag_banner.png'),
  goomba: [loadImage('assets/enemy_goomba_0.png'), loadImage('assets/enemy_goomba_1.png')],
  turtle: [loadImage('assets/enemy_turtle_0.png'), loadImage('assets/enemy_turtle_1.png')],
};
// Player character (custom art, cropped/background-removed from assets/main-character.png source sheet)
const charSprites = {
  idle: loadImage('assets/character/idle.png'),
  run: loadImage('assets/character/run.png'),
  jump: loadImage('assets/character/jump.png'),
  doubleJump: loadImage('assets/character/doublejump.png'),
  attack: loadImage('assets/character/attack.png'),
  hurt: loadImage('assets/character/hurt.png'),
  victory: loadImage('assets/character/victory.png'),
};
const CHAR_DISPLAY_HEIGHT = 42; // world-unit height the character is drawn at (bottom-anchored on the hitbox)
const JUMP_VELOCITY = -8;
const ATTACK_DURATION = 24;       // total frames the attack pose/hitbox sequence lasts (~0.4s)
const ATTACK_ACTIVE = [8, 18];    // frame window (counting down from ATTACK_DURATION) where the hit connects
const ATTACK_LUNGE = 10;          // world-units the sprite visually lunges forward mid-swing
const ATTACK_REACH = 26;          // width of the attack hitbox extending in front of the player
const TILE = 30; // on-screen size for ground/block tiles

// decorative trees & bushes along the level (purely visual, no collision) -
// each one kept well inside its platform's span so it never floats over a gap
const decorations = [
  { type: 'tree', x: 150 },  { type: 'bush', x: 260 },  { type: 'tree', x: 400 },
  { type: 'tree', x: 640 },  { type: 'bush', x: 720 },
  { type: 'tree', x: 950 },  { type: 'bush', x: 1030 },
  { type: 'tree', x: 1250 }, { type: 'tree', x: 1400 }, { type: 'bush', x: 1550 },
  { type: 'tree', x: 1850 }, { type: 'bush', x: 2000 }, { type: 'tree', x: 2150 }, { type: 'bush', x: 2300 },
];

// ---- Level layout ----
// platforms: static rectangles the player and enemies can stand on.
// Gaps are 45 world-units wide; the jump physics below comfortably clear ~90+ units,
// so gaps are crossable with generous timing margin instead of needing pixel-perfect jumps.
const platforms = [
  { x: 0,    y: GROUND_Y, w: 500, h: GROUND_DEPTH },
  { x: 545,  y: GROUND_Y, w: 255, h: GROUND_DEPTH },
  { x: 845,  y: GROUND_Y, w: 255, h: GROUND_DEPTH },
  { x: 610,  y: GROUND_Y - 100, w: 120, h: 20, deco: 'block' },
  { x: 1145, y: GROUND_Y, w: 505, h: GROUND_DEPTH },
  { x: 1350, y: GROUND_Y - 80,  w: 100, h: 20, deco: 'block' },
  { x: 1695, y: GROUND_Y, w: 905, h: GROUND_DEPTH },
];
const LEVEL_WIDTH = 2600;
const FINISH_X = 2440;

function makeEnemy(x, y, range, type) {
  return { x, y, w: 28, h: 28, vx: 0.7, startX: x, range, alive: true, type, anim: 0 };
}
const enemies = [
  makeEnemy(250, GROUND_Y - 28, 150, 'goomba'),
  makeEnemy(670, GROUND_Y - 28, 90, 'goomba'),
  makeEnemy(970, GROUND_Y - 28, 110, 'turtle'),
  makeEnemy(1400, GROUND_Y - 28, 180, 'goomba'),
  makeEnemy(2100, GROUND_Y - 28, 200, 'turtle'),
];

const player = {
  x: 40, y: GROUND_Y - 32, w: 24, h: 32,
  vx: 0, vy: 0, onGround: false, facing: 1, alive: true, anim: 0,
  hurtTimer: 0, attackTimer: 0, jumpsUsed: 0, invulnerable: 0,
};
const INVULN_DURATION = 90; // ~1.5s of blinking invincibility after getting hit - enough time to move away
let lives = 3;
let camX = 0;
let state = 'intro'; // intro | playing | win | dead
const keys = {};
// keysPressed: "just pressed this frame" edge detection (as opposed to `keys`, which is
// held-down level state) - needed so jump/attack trigger once per press, not once per frame held
const keysPressed = new Set();

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!e.repeat) keysPressed.add(e.code);
});
document.addEventListener('keyup', e => keys[e.code] = false);
document.getElementById('restartBtn').addEventListener('click', () => location.reload());

const legend = document.getElementById('legend');
document.getElementById('legendCloseBtn').addEventListener('click', () => {
  legend.classList.add('hidden');
  if (state === 'intro') state = 'playing';
});
document.getElementById('helpBtn').addEventListener('click', () => {
  legend.classList.remove('hidden');
  if (state === 'playing') state = 'intro'; // pause the action while re-reading controls
});

// on resize/orientation-change, recompute scale and shift existing entities so the
// ground stays at the same screen proportion instead of resetting the game
function handleResize() {
  updateScale();
  const newGroundY = Math.round(logicalHeight() * GROUND_RATIO);
  const dy = newGroundY - GROUND_Y;
  if (dy !== 0) {
    for (const p of platforms) p.y += dy;
    for (const e of enemies) e.y += dy;
    player.y += dy;
    GROUND_Y = newGroundY;
  }
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', handleResize);

function setZoom(newViewWidth) {
  VIEW_WIDTH = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newViewWidth));
  localStorage.setItem('platformer_viewWidth', VIEW_WIDTH);
  handleResize();
}
document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(VIEW_WIDTH - ZOOM_STEP));
document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(VIEW_WIDTH + ZOOM_STEP));

function resetPlayerPosition() {
  player.x = 40; player.y = GROUND_Y - 32;
  player.vx = 0; player.vy = 0;
  camX = 0;
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// small impact-spark burst, spawned where an attack lands a hit
const particles = [];
function spawnBurst(x, y) {
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
    const speed = 1 + Math.random() * 1.5;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 18, maxLife: 18 });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function updatePlayer() {
  const jumpPressed = keysPressed.has('Space') || keysPressed.has('ArrowUp') || keysPressed.has('KeyW');
  const attackPressed = keysPressed.has('KeyX');

  // horizontal input
  if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -1.6; player.facing = -1; }
  else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = 1.6; player.facing = 1; }
  else player.vx = 0;

  // jump / double jump - edge-triggered (keysPressed) so holding the key can't spam extra jumps
  if (jumpPressed) {
    if (player.onGround) {
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
      player.jumpsUsed = 1;
      playSound('jump');
    } else if (player.jumpsUsed === 1) {
      player.vy = JUMP_VELOCITY;
      player.jumpsUsed = 2;
      playSound('jump');
    }
  }

  // attack - can't re-trigger until the current swing finishes; hits everything in
  // front of the player during the active window in the middle of the swing
  if (attackPressed && player.attackTimer <= 0) {
    player.attackTimer = ATTACK_DURATION;
    playSound('attack');
  }
  if (player.attackTimer > 0) {
    player.attackTimer--;
    const framesElapsed = ATTACK_DURATION - player.attackTimer;
    if (framesElapsed >= ATTACK_ACTIVE[0] && framesElapsed <= ATTACK_ACTIVE[1]) {
      const hitbox = {
        x: player.facing > 0 ? player.x + player.w : player.x - ATTACK_REACH,
        y: player.y, w: ATTACK_REACH, h: player.h,
      };
      for (const e of enemies) {
        if (e.alive && rectsOverlap(hitbox, e)) {
          e.alive = false;
          playSound('stomp');
          spawnBurst(e.x + e.w / 2, e.y + e.h / 2);
        }
      }
    }
  }

  if (player.vx !== 0) player.anim += Math.abs(player.vx) * 0.15;
  if (player.hurtTimer > 0) player.hurtTimer--;
  if (player.invulnerable > 0) player.invulnerable--;

  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  // move horizontally, resolve collisions
  player.x += player.vx;
  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }
  if (player.x < 0) player.x = 0;

  // move vertically, resolve collisions
  player.onGround = false;
  player.y += player.vy;
  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.jumpsUsed = 0;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // fell into a pit
  if (player.y > logicalHeight() + 100) {
    hurtPlayer(true);
  }

  // camera follows player, clamped to level bounds
  camX = player.x - VIEW_WIDTH / 3;
  camX = Math.max(0, Math.min(camX, LEVEL_WIDTH - VIEW_WIDTH));

  // reached the finish line
  if (player.x >= FINISH_X) {
    state = 'win';
    playSound('win');
    showOverlay('You Win!');
  }

  keysPressed.clear(); // this frame's presses have been consumed
}

// reposition=true for falling off the level (nowhere to stand, so send back to safe ground);
// reposition=false for an enemy touch (stay put - blinking invincibility gives room to escape instead)
function hurtPlayer(reposition) {
  if (state !== 'playing' || player.invulnerable > 0) return;
  lives--;
  playSound('hurt');
  player.hurtTimer = 30; // ~0.5s showing the hurt pose
  player.invulnerable = INVULN_DURATION;
  document.getElementById('lives').textContent = Math.max(lives, 0);
  if (lives <= 0) {
    state = 'dead';
    playSound('gameover');
    showOverlay('Game Over');
  } else if (reposition) {
    resetPlayerPosition();
  }
}

function showOverlay(text) {
  document.getElementById('overlayText').textContent = text;
  document.getElementById('overlay').style.display = 'flex';
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    e.anim += 0.1;
    if (e.x < e.startX - e.range || e.x > e.startX + e.range) e.vx *= -1;

    if (player.alive && rectsOverlap(player, e)) {
      const playerFalling = player.vy > 0 && (player.y + player.h) - e.y < 14;
      if (playerFalling) {
        e.alive = false;
        player.vy = -8; // bounce off stomped enemy
        playSound('stomp');
      } else {
        hurtPlayer(false);
      }
    }
  }
}

function drawTiled(img, x, y, w, h) {
  for (let cy = 0; cy < h; cy += TILE) {
    const th = Math.min(TILE, h - cy);
    for (let cx = 0; cx < w; cx += TILE) {
      ctx.drawImage(img, x + cx, y + cy, Math.min(TILE, w - cx), th);
    }
  }
}

// draw an image flipped horizontally around its own box when facing < 0
function drawFacing(img, x, y, w, h, facing) {
  if (facing < 0) {
    ctx.save();
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, w, h);
    ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
}

function draw() {
  // sky gradient in screen space (fixed, behind the scrolling/scaled world)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#5c94fc');
  sky.addColorStop(1, '#b8ddf5');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // world space: scale so VIEW_WIDTH world-units always spans the screen, then pan by the camera
  ctx.setTransform(scale, 0, 0, scale, -camX * scale, 0);

  // background decorations (trees & bushes)
  for (const d of decorations) {
    const img = d.type === 'tree' ? sprites.tree : sprites.bush;
    const w = 36, h = 36;
    ctx.drawImage(img, d.x, GROUND_Y - h + 6, w, h);
  }

  // platforms (only draw down to the visible viewport, not the full fill depth)
  for (const p of platforms) {
    const img = p.deco === 'block' ? sprites.questionBlock : sprites.ground;
    const visibleH = Math.min(p.h, logicalHeight() - p.y + TILE);
    drawTiled(img, p.x, p.y, p.w, visibleH);
  }

  // finish flag pole
  const poleTop = GROUND_Y - 190;
  drawTiled(sprites.flagPole, FINISH_X + 20, poleTop, 18, GROUND_Y - poleTop);
  ctx.drawImage(sprites.flagBanner, FINISH_X + 2, poleTop, 30, 30);

  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    const frames = e.type === 'goomba' ? sprites.goomba : sprites.turtle;
    const frame = frames[Math.floor(e.anim) % frames.length];
    drawFacing(frame, e.x, e.y, e.w, e.h, e.vx >= 0 ? 1 : -1);
  }

  // player: pick a pose sprite for the current state, drawn bottom-anchored on the
  // physics hitbox and scaled to CHAR_DISPLAY_HEIGHT (preserving the art's own aspect ratio)
  let poseImg;
  if (state === 'win') poseImg = charSprites.victory;
  else if (player.hurtTimer > 0) poseImg = charSprites.hurt;
  else if (player.attackTimer > 0) poseImg = charSprites.attack;
  else if (!player.onGround) poseImg = player.jumpsUsed >= 2 ? charSprites.doubleJump : charSprites.jump;
  else if (player.vx !== 0) poseImg = charSprites.run;
  else poseImg = charSprites.idle;

  // while invulnerable after getting hit, blink on/off every 4 frames (classic i-frames feedback)
  const blinkedOut = player.invulnerable > 0 && Math.floor(player.invulnerable / 4) % 2 === 0;

  if (poseImg.naturalWidth > 0 && !blinkedOut) {
    const dispH = CHAR_DISPLAY_HEIGHT;
    const dispW = dispH * (poseImg.naturalWidth / poseImg.naturalHeight);
    let drawX = player.x + player.w / 2 - dispW / 2;
    const drawY = player.y + player.h - dispH;

    // procedural "lunge" for the attack swing, since the source art is a single static
    // pose: thrust forward then back over the swing's duration (sine ease in/out)
    if (player.attackTimer > 0) {
      const progress = (ATTACK_DURATION - player.attackTimer) / ATTACK_DURATION;
      drawX += Math.sin(progress * Math.PI) * ATTACK_LUNGE * player.facing;
    }

    drawFacing(poseImg, drawX, drawY, dispW, dispH, player.facing);
  }

  // attack swipe VFX: a procedural magic-arc swoosh (the source art has only one static
  // attack pose, so the "animation" is this canvas-drawn swing, not a sprite sequence)
  if (player.attackTimer > 0) {
    const progress = (ATTACK_DURATION - player.attackTimer) / ATTACK_DURATION;
    const swipeAlpha = Math.sin(Math.min(progress, 1) * Math.PI);
    const cx = player.x + player.w / 2;
    const cy = player.y + player.h * 0.42;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(player.facing, 1);
    ctx.rotate((progress - 0.5) * 0.9);
    ctx.strokeStyle = `rgba(255,255,255,${(0.85 * swipeAlpha).toFixed(2)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(6, 0, 20, -0.7, 0.7);
    ctx.stroke();
    ctx.strokeStyle = `rgba(180,220,255,${(0.6 * swipeAlpha).toFixed(2)})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(6, 0, 14, -0.6, 0.6);
    ctx.stroke();
    ctx.restore();
  }

  // impact particles (spawned where a successful attack hit lands)
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = `rgba(255,220,120,${alpha.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 * alpha + 1, 0, Math.PI * 2);
    ctx.fill();
  }
}

function loop() {
  if (state === 'playing') {
    updatePlayer();
    updateEnemies();
    updateParticles();
  }
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
